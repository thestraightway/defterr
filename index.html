<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E8EBE6">
<meta name="application-name" content="Темп">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Темп">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Темп</title>
<style>

/* Layout: одна колонка, как в приложении-заметках. Главная с личной плиткой элемента, нижняя панель вкладок,
   шторки для форм, свайпы по строкам.
   Дизайн-план: оливково-графитовые нейтрали без синевы, акцент выбирается из шести палитр (по умолчанию «Мышьяк», жёлтый
   аурипигмент), зелёный и красный только для денег. Заголовки и крупные суммы Unbounded, текст Onest, метки JetBrains Mono. */
:root{
  --bg:#E8EBE6; --surface:#F8F9F6; --surface-2:#DCE0D8; --ink:#151915; --ink-2:#596257; --line:#CED3CB;
  --accent:#8A6A00; --accent-ink:#FFFFFF; --accent-soft:color-mix(in srgb,var(--accent) 14%,var(--surface));
  --gain:#1B7F4B; --loss:#C2432B; --warn:#8A5A0B; --warn-soft:#F0E5C6;
  --shadow:0 1px 2px rgba(20,25,20,.06),0 10px 26px -14px rgba(20,25,20,.3);
  --scrim:rgba(8,12,8,.5);
  --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter','Segoe UI',Roboto,system-ui,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter','Segoe UI',Roboto,system-ui,sans-serif;
  --font-mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F120F; --surface:#171B17; --surface-2:#232823; --ink:#E9EDE6; --ink-2:#929B90; --line:#2A302A;
    --accent:#E8C547; --accent-ink:#1E1800;
    --gain:#52C484; --loss:#FF8A6B; --warn:#E2B158; --warn-soft:#33290F;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px -14px rgba(0,0,0,.8);
    --scrim:rgba(0,0,0,.66);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F120F; --surface:#171B17; --surface-2:#232823; --ink:#E9EDE6; --ink-2:#929B90; --line:#2A302A;
  --accent:#E8C547; --accent-ink:#1E1800;
  --gain:#52C484; --loss:#FF8A6B; --warn:#E2B158; --warn-soft:#33290F;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 26px -14px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.66);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;padding-inline:16px;padding-block:12px 110px;-webkit-text-size-adjust:100%}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;letter-spacing:-.022em;text-wrap:balance}
.shell{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:16px;min-width:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.mono{font-family:var(--font-mono)}
.grow{flex:1}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.proj-btn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px 6px 0;min-width:0;text-align:left}
.proj-btn h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:12px;height:12px;border-radius:4px;background:var(--c,var(--accent))}
.tag{flex:none;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:2px 7px;border-radius:6px}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg,.btn svg{display:block}
svg.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.banner{max-width:520px;margin:0 auto 12px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{background:none;border:0;font-weight:600;text-decoration:underline;color:inherit;padding:4px}

/* cards & text */
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-title{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;font-family:var(--font-mono)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.sec-head .card-title{margin:0}
.empty{text-align:center;padding:26px 16px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-family:var(--font-display);font-weight:600;font-size:15px;margin-bottom:6px}
.hintcard{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.hintcard span{flex:1}
.hintcard button{background:none;border:0;font-weight:600;color:var(--accent);padding:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--loss);border-color:var(--loss)}
.btn.armed{background:var(--loss);color:var(--bg);border-color:var(--loss)}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 12px 24px -8px color-mix(in srgb,var(--accent) 60%,transparent);z-index:5}
.fab svg{width:26px;height:26px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:6}
#tabs .in{max-width:520px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px}
#tabs button{background:none;border:0;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--ink-2);min-height:52px;min-width:0}
#tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}

/* swipe rows */
.sw-row{position:relative;overflow:hidden}
.sw-fg{position:relative;background:var(--surface);touch-action:pan-y;-webkit-touch-callout:none}
.sw-bg{position:absolute;inset:0;visibility:hidden}
.sw-row.drag .sw-bg{visibility:visible}
.sw-a{position:absolute;inset:0;display:none;align-items:center;gap:8px;padding:0 20px;background:var(--ac);color:var(--bg);font-weight:600;font-size:14px}
.sw-a.ra{justify-content:flex-start}
.sw-a.la{justify-content:flex-end}
.sw-row[data-dir="r"] .ra{display:flex}
.sw-row[data-dir="l"] .la{display:flex}
.sw-row.hit .sw-a b{text-decoration:underline}
[data-nav]{touch-action:pan-y}

/* hero & home */
.hero{position:relative;display:flex;align-items:center;gap:16px;padding:18px 16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.hello{flex:1;min-width:0}
.hello h2{font-size:20px;font-weight:500;line-height:1.2;margin:4px 0 8px;overflow-wrap:anywhere;padding-right:28px}
.hello .sub{font-size:13px;color:var(--ink-2)}
.eye{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:10px;border-color:transparent;background:none;color:var(--ink-2)}
.tile{flex:none;position:relative;width:96px;height:96px;border:1.5px solid color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:12px;background:var(--bg);color:var(--ink);display:block}
.tile i{position:absolute;font-style:normal;font-family:var(--font-mono);font-size:10.5px;font-weight:600;color:var(--ink-2)}
.tile .tn{top:6px;left:8px}
.tile .tm{top:6px;right:8px}
.tile .ts{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:8px;font-family:var(--font-display);font-weight:600;font-size:38px;letter-spacing:-.03em;color:var(--accent)}
.tile .tname{position:absolute;left:6px;right:6px;bottom:6px;text-align:center;font-family:var(--font-mono);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.big{width:132px;height:132px}
.tile.big .ts{font-size:54px}
.tile.big i{font-size:12px}
.tile.big .tname{font-size:13px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0}
.mini-card small{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.mini-card strong{font-family:var(--font-display);font-weight:600;font-size:clamp(15px,4.6vw,20px);letter-spacing:-.02em;overflow-wrap:anywhere}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:0;border-radius:14px;padding:12px 4px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow);min-width:0}
.qa button span.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink)}
.pinned{display:flex;flex-direction:column;gap:10px}

/* planner */
.week{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:4px;align-items:center}
.week .nav{width:32px;height:44px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;padding:0}
.day{border:0;background:none;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;color:var(--ink-2);font-size:12px;position:relative}
.day b{font-size:16px;color:var(--ink);font-weight:600}
.day[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.day[aria-pressed="true"] b{color:var(--accent-ink)}
.day.today::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--accent)}
.day.today[aria-pressed="true"]::after{background:var(--accent-ink)}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dayhead h2{font-size:20px;text-transform:capitalize}
.ring{position:relative;width:54px;height:54px;flex:none}
.ring svg{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--gain);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.task{border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .sw-fg{display:flex;align-items:center;gap:4px}
.check{flex:none;width:44px;height:48px;background:none;border:0;display:grid;place-items:center;padding:0}
.check i{width:24px;height:24px;border-radius:8px;border:2px solid var(--ink-2);display:grid;place-items:center;color:transparent;transition:.15s}
.is-done .check i{background:var(--gain);border-color:var(--gain);color:var(--bg)}
.task-main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:10px 0;display:flex;flex-direction:column;gap:1px}
.task-main .t{font-weight:500;overflow-wrap:anywhere;display:flex;align-items:center;gap:6px}
.task-main .m{font-size:12.5px;color:var(--ink-2)}
.starm{color:var(--accent);display:inline-flex;flex:none}
.starm svg{fill:currentColor}
.is-done .t{text-decoration:line-through;color:var(--ink-2)}
.over .m{color:var(--loss)}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--ink-2)}
.streak{color:var(--gain);font-weight:600}

/* ledger */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px 12px 13px;box-shadow:var(--shadow);min-width:0}
.stat small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin-bottom:6px}
.stat small i{width:8px;height:8px;border-radius:3px;display:block}
.stat strong{font-family:var(--font-display);font-weight:600;font-size:clamp(13px,4.1vw,18px);letter-spacing:-.02em;display:block;overflow-wrap:anywhere}
.stat.profit{background:var(--accent);color:var(--accent-ink)}
.stat.profit small{color:inherit;opacity:.8}
.stat.profit.neg{background:var(--loss);color:var(--bg)}
.chart{width:100%;height:auto;display:block}
.chart .b-in{fill:var(--gain)}
.chart .b-out{fill:var(--loss)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--ink-2);font-size:9px;font-family:var(--font-body)}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:6px 0}
.cat span:first-child{overflow-wrap:anywhere}
.cat .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--loss);border-radius:3px}
.debt{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.debt:first-of-type{border-top:0}
.debt .who{flex:1;min-width:0}
.debt .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.group{display:flex;flex-direction:column}
.ghead{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:6px 4px}
.rows{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.rowwrap{border-top:1px solid var(--line)}
.rowwrap:first-child{border-top:0}
.row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:11px 14px;text-align:left;min-width:0}
.row .mid{flex:1;min-width:0}
.row .mid b{display:block;font-weight:500;overflow-wrap:anywhere}
.row .mid span{font-size:12.5px;color:var(--ink-2)}
.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.in{color:var(--gain)}
.amt.out{color:var(--loss)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:1px}
.filters{display:flex;gap:8px;align-items:center}
.filters .search{flex:1;min-width:0}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-inline:-2px;padding-inline:2px}
.quick .chip{flex:none}

/* calc */
.item{border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .sw-fg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:12px 0}
.item .nm{background:none;border:0;text-align:left;padding:0;min-width:0}
.item .nm b{display:block;font-weight:600;overflow-wrap:anywhere}
.item .nm span{font-size:12.5px;color:var(--ink-2)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.qty button{width:38px;height:42px;border:0;background:none;font-size:20px;font-weight:600;color:var(--accent)}
.qty input{width:56px;height:42px;border:0;background:none;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;padding:0;min-width:0}
.line{grid-column:1/-1;display:flex;justify-content:flex-end;font-size:13px;color:var(--ink-2)}
.line b{color:var(--ink);font-variant-numeric:tabular-nums}
.total{display:flex;flex-direction:column;gap:10px}
.total .big{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-.02em}
.split{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* notes */
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;min-width:0}
.notebar{display:flex;gap:8px;align-items:center}
.notebar .search{flex:1}
.notelist{display:flex;flex-direction:column;gap:10px}
.notelist.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.notelist .ghead{grid-column:1/-1;padding:4px 2px 0}
.ncwrap{border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.ncard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:none;border:0;padding:14px 16px;min-width:0}
.ncard b{display:flex;align-items:center;gap:6px;font-weight:600;overflow-wrap:anywhere}
.ncard b svg{flex:none;color:var(--accent)}
.ncard p{margin:0;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;white-space:pre-line;font-size:14px}
.ncard small{color:var(--ink-2);font-size:12px}
.prog{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gain);border-radius:3px}
.minitags{display:flex;gap:6px;flex-wrap:wrap}
.minitags span,.hash{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent)}
.tagbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.tagbar .chip{flex:none}
.nbody{display:block;width:100%;min-height:240px;border:0;background:none;resize:none;padding:0;line-height:1.6;outline:none;overflow:hidden}
.ntitle{width:100%;border:0;background:none;font-family:var(--font-display);font-weight:600;font-size:20px;padding:0;outline:none;letter-spacing:-.01em;margin:6px 0 8px}
.tb{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;position:sticky;top:0;background:var(--surface);z-index:2}
.tb button{flex:none;min-height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:14px}
.readview{display:flex;flex-direction:column;gap:6px;min-height:240px;line-height:1.6}
.readview p{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.readview .gap{height:8px}
.cl{display:flex;align-items:flex-start;gap:10px;background:none;border:0;padding:6px 0;text-align:left;width:100%}
.cl i{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--ink-2);display:grid;place-items:center;color:transparent;margin-top:1px}
.cl.on i{background:var(--gain);border-color:var(--gain);color:var(--bg)}
.cl.on span{text-decoration:line-through;color:var(--ink-2)}
.cl span{overflow-wrap:anywhere}
.ne-foot{margin-top:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sheet-head .hgap{display:flex;gap:8px}

/* settings */
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:48px;border-top:1px solid var(--line);cursor:pointer}
.switchrow:first-of-type{border-top:0}
.switchrow span small{display:block;color:var(--ink-2);font-size:12.5px}

function chartSVG(s) {
  const W = 320, H = 100, top = 14, base = 78, bh = base - top;
  const max = Math.max(1, Math.max.apply(null, s.dIn.concat(s.dOut)));
  const slot = W / s.dim, bw = Math.max(2, slot * 0.34);
  let bars = '';
  for (let i = 0; i < s.dim; i++) {
    const x = i * slot + slot * 0.14, hi = s.dIn[i] / max * bh, ho = s.dOut[i] / max * bh;
    if (hi > 0) bars += '<rect class="b-in" x="' + x.toFixed(2) + '" y="' + (base - hi).toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + hi.toFixed(2) + '" rx="1"/>';
    if (ho > 0) bars += '<rect class="b-out" x="' + (x + bw + 1).toFixed(2) + '" y="' + (base - ho).toFixed(2) + '" width="' + bw.toFixed(2) + '" height="' + ho.toFixed(2) + '" rx="1"/>';
  }
  let labels = '';
  [1, 5, 10, 15, 20, 25, s.dim].forEach((d, k, arr) => { if (arr.indexOf(d) !== k || d > s.dim) return; if (d !== s.dim && s.dim - d < 3) return; labels += '<text x="' + ((d - 1) * slot + slot * 0.45).toFixed(1) + '" y="94" text-anchor="middle">' + d + '</text>'; });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Доходы и расходы по дням месяца"><line class="gl" x1="0" x2="' + W + '" y1="' + base + '" y2="' + base + '"/><line class="gl" x1="0" x2="' + W + '" y1="' + top + '" y2="' + top + '" stroke-dasharray="3 4"/><text x="0" y="9">' + mfmt(max) + '</text>' + bars + labels + '</svg>';
}

function payDebt(e, amount) {

}
